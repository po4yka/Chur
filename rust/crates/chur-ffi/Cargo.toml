[package]
name = "chur-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Stable C ABI data plane and ABI handshake for mobile hosts."

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
chur-core.workspace = true
chur-crypto.workspace = true
chur-format.workspace = true
chur-catalog.workspace = true
chur-media.workspace = true

zeroize.workspace = true

# `chur-ffi` is the one crate permitted to contain `unsafe`. The workspace sets
# `unsafe_code = "forbid"`, which no inner `allow` or `expect` can lift, and the
# v1 C ABI of docs/interop/FFI_CONTRACT.md cannot be exported under it. This
# crate therefore declares its own lint tables instead of inheriting and sets
# `unsafe_code = "deny"`, which a block overrides with `#[expect(unsafe_code)]`
# and an adjacent SAFETY comment. The exception and the rule that these levels
# track `[workspace.lints]` are recorded in docs/DEPENDENCY_POLICY.md,
# "Unsafe code".
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
# `all` is a lint group, so it needs a lower priority than the individual
# lints below it; at equal priority rustc cannot order the group against its
# members and refuses to compile.
all = { level = "warn", priority = -1 }
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
todo = "warn"
