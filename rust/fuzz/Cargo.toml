# Fuzz targets for the Chur parsers.
#
# `docs/assurance/FUZZING.md` §2 lists the initial Rust targets. A target lands
# here when its subject exists; the catalog snapshot target named
# there is absent because its parser is.
#
# This is its own workspace on purpose. libFuzzer needs a nightly toolchain and
# sanitizer flags that must not reach the library build, and the fuzz binaries
# must not enter the release dependency graph.

[package]
name = "chur-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "BSD-3-Clause"

[package.metadata]
cargo-fuzz = true

# The version beside the path keeps the `wildcards = "deny"` rule of
# rust/deny.toml true for this graph too: a path-only requirement is a
# wildcard to it. These are workspace members carrying 0.1.0.
[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
chur-core = { path = "../crates/chur-core", version = "0.1.0" }
chur-crypto = { path = "../crates/chur-crypto", version = "0.1.0" }
chur-format = { path = "../crates/chur-format", version = "0.1.0" }
chur-ffi = { path = "../crates/chur-ffi", version = "0.1.0" }
chur-sync-protocol = { path = "../crates/chur-sync-protocol", version = "0.1.0" }

[[bin]]
name = "parse_canonical_value"
path = "fuzz_targets/parse_canonical_value.rs"
test = false
doc = false
bench = false

