[workspace]
resolver = "3"
members = [
    "crates/chur-core",
    "crates/chur-crypto",
    "crates/chur-format",
    "crates/chur-catalog",
    "crates/chur-media",
    "crates/chur-sync-protocol",
    "crates/chur-ffi",
    "crates/chur-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Minimum supported Rust version. Edition 2024 and resolver 3 both require 1.85.
rust-version = "1.85"
license = "BSD-3-Clause"
repository = "https://github.com/po4yka/Chur"

[workspace.dependencies]
# An intra-workspace dependency carries an explicit version as well as a path.
# A path with no version is a wildcard requirement, which `cargo deny` rejects
# under the `wildcards = "deny"` rule in deny.toml.
chur-core = { path = "crates/chur-core", version = "0.1.0" }
chur-crypto = { path = "crates/chur-crypto", version = "0.1.0" }
chur-format = { path = "crates/chur-format", version = "0.1.0" }

# Cryptography. Narrow, well-reviewed libraries only (DEPENDENCY_POLICY.md).
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
blake3 = "1"
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
getrandom = "0.3"
hkdf = "0.12"
sha2 = { version = "0.10", default-features = false }
subtle = { version = "2", default-features = false }
zeroize = { version = "1", default-features = false, features = ["alloc"] }

# Errors and CLI.
thiserror = "2"
clap = { version = "4", features = ["derive"] }

# Tooling only. These never appear in a dependency of chur-crypto or
# chur-format: TEST_VECTORS.md section 2 makes manifest.json an index, not a
# canonical protocol encoding, so no serializer default can reach persisted
# bytes through them.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
# `all` is a lint group, so it needs a lower priority than the individual
# lints below it; at equal priority rustc cannot order the group against its
# members and refuses to compile.
all = { level = "warn", priority = -1 }
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
todo = "warn"

[profile.release]
overflow-checks = true
# FFI panic containment: every `chur_*` export wraps its body in catch_unwind and
# converts a panic into INTERNAL_FAILURE, which requires unwinding to be enabled.
# See docs/interop/FFI_CONTRACT.md section 11 and docs/adr/0016-freeze-the-v1-c-abi.md.
panic = "unwind"
