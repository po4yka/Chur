[workspace]
resolver = "3"
members = [
    "crates/chur-core",
    "crates/chur-crypto",
    "crates/chur-format",
    "crates/chur-catalog",
    "crates/chur-media",
    "crates/chur-sync-protocol",
    "crates/chur-ffi",
    "crates/chur-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Minimum supported Rust version. Edition 2024 and resolver 3 both require 1.85.
rust-version = "1.85"
license = "BSD-3-Clause"
repository = "https://github.com/po4yka/Chur"

[workspace.dependencies]
# An intra-workspace dependency carries an explicit version as well as a path.
# A path with no version is a wildcard requirement, which `cargo deny` rejects
# under the `wildcards = "deny"` rule in deny.toml.
chur-core = { path = "crates/chur-core", version = "0.1.0" }
chur-crypto = { path = "crates/chur-crypto", version = "0.1.0" }
chur-format = { path = "crates/chur-format", version = "0.1.0" }
chur-catalog = { path = "crates/chur-catalog", version = "0.1.0" }
chur-media = { path = "crates/chur-media", version = "0.1.0" }

# Cryptography. Narrow, well-reviewed libraries only (DEPENDENCY_POLICY.md).
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
blake3 = "1"
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
getrandom = "0.3"
hkdf = "0.12"
sha2 = { version = "0.10", default-features = false }
subtle = { version = "2", default-features = false }
zeroize = { version = "1", default-features = false, features = ["alloc"] }
# NFKD for recovery-phrase re-entry, which ADR-0029 requires. Data tables only,
# no unsafe, no build script, no transitive dependency.
unicode-normalization = { version = "0.1", default-features = false }

# The private catalog engine. ADR-0004 names SQLCipher accessed directly from
# Rust as the physical implementation, and CATALOG_SCHEMA_V1.md section 16.4
# requires the FTS5 module the same SQLite build already carries. Default
# features are off: they add a WebAssembly VFS and its wasm-bindgen graph that
# no Chur target uses.
rusqlite = { version = "0.40", default-features = false, features = [
    "bundled-sqlcipher-vendored-openssl",
    "column_decltype",
    "limits",
] }

# Errors and CLI.
thiserror = "2"
clap = { version = "4", features = ["derive"] }

# Tooling only. These never appear in a dependency of chur-crypto or
# chur-format: TEST_VECTORS.md section 2 makes manifest.json an index, not a
# canonical protocol encoding, so no serializer default can reach persisted
# bytes through them.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
# `all` is a lint group, so it needs a lower priority than the individual
# lints below it; at equal priority rustc cannot order the group against its
# members and refuses to compile.
all = { level = "warn", priority = -1 }
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
todo = "warn"

# Cryptographic primitives are optimized even in a debug build. Argon2id at the
# frozen 64 MiB floor of PASSWORD_PROFILE.md section 4 takes seconds per
# derivation when compiled without optimization, and an unlock runs two, so an
# unoptimized suite spends minutes inside the primitive. Optimizing only these
# packages keeps every Chur crate debuggable and changes no behaviour: the
# output of a derivation does not depend on the optimization level.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake3]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.chacha20poly1305]
opt-level = 3

[profile.release]
overflow-checks = true
# FFI panic containment: every `chur_*` export wraps its body in catch_unwind and
# converts a panic into INTERNAL_FAILURE, which requires unwinding to be enabled.
# See docs/interop/FFI_CONTRACT.md section 11 and docs/adr/0016-freeze-the-v1-c-abi.md.
panic = "unwind"
