name: Chur
options:
  createIntermediateGroups: true
targets:
  Chur:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - Sources
      - Resources
      - Assets.xcassets
      - ChurMirror.icon
      - SpiritRenderer/ChurSpiritRenderer.swift
      - SpiritRenderer/ChurSpiritView.mm
      - SpiritRenderer/SpiritScene.cpp
      - path: SpiritRenderer/Resources/chur_interactive.glb
        buildPhase: resources
      - path: SpiritRenderer/Resources/chur_interactive.manifest.json
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        CADisableMinimumFrameDurationOnPhone: true
        LSRequiresIPhoneOS: true
        NSCameraUsageDescription: "Take public photos when you tap Take photo. Photos are saved only when you choose Save photo."
        NSPhotoLibraryAddUsageDescription: "Save selected vault media to your photo library."
        NSPhotoLibraryUsageDescription: "Import complete Live Photo resources and review deletion of imported originals only when you choose."
        NSLocalNetworkUsageDescription: "Connect directly to your other device to sync this vault while both apps are open."
        NSFaceIDUsageDescription: "Use Face ID to open your Chur vault and to confirm it's you before showing a recovery phrase."
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: dev.po4yka.chur.live-photo
            UTTypeDescription: Chur Live Photo bundle
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - churlive
              public.mime-type:
                - application/vnd.chur.live-photo
        UILaunchScreen: {}
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: dev.po4yka.chur.action.import
            UIApplicationShortcutItemTitle: "Import"
            UIApplicationShortcutItemIconSymbolName: square.and.arrow.down
          - UIApplicationShortcutItemType: dev.po4yka.chur.action.search
            UIApplicationShortcutItemTitle: "Search"
            UIApplicationShortcutItemIconSymbolName: magnifyingglass
          - UIApplicationShortcutItemType: dev.po4yka.chur.action.lock-and-hide
            UIApplicationShortcutItemTitle: "Lock and hide"
            UIApplicationShortcutItemIconSymbolName: lock.fill
          - UIApplicationShortcutItemType: dev.po4yka.chur.action.new-private-note
            UIApplicationShortcutItemTitle: "New private note"
            UIApplicationShortcutItemIconSymbolName: square.and.pencil
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: "$(PRODUCT_MODULE_NAME).SceneDelegate"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.po4yka.chur
        CODE_SIGN_ENTITLEMENTS: IncomingShare.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: ChurMirror
        ARCHS: arm64
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) CHUR_FILAMENT"
        SWIFT_OBJC_BRIDGING_HEADER: "$(SRCROOT)/SpiritRenderer/ChurSpirit-Bridging-Header.h"
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/SpiritRenderer/.vendor/filament/include"
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        CLANG_CXX_LIBRARY: libc++
        CLANG_ENABLE_OBJC_ARC: YES
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(DERIVED_FILE_DIR)"
        OTHER_LDFLAGS: "$(inherited) $(DERIVED_FILE_DIR)/ChurApp.framework/ChurApp $(DERIVED_FILE_DIR)/libchur_ffi.a -framework Metal -framework QuartzCore -framework CoreVideo -lc++ -lz $(DERIVED_FILE_DIR)/chur-filament/libgltfio_core.a $(DERIVED_FILE_DIR)/chur-filament/libuberarchive.a $(DERIVED_FILE_DIR)/chur-filament/libuberzlib.a $(DERIVED_FILE_DIR)/chur-filament/libfilament.a $(DERIVED_FILE_DIR)/chur-filament/libbackend.a $(DERIVED_FILE_DIR)/chur-filament/libfilabridge.a $(DERIVED_FILE_DIR)/chur-filament/libfilaflat.a $(DERIVED_FILE_DIR)/chur-filament/libutils.a $(DERIVED_FILE_DIR)/chur-filament/libgeometry.a $(DERIVED_FILE_DIR)/chur-filament/libstb.a $(DERIVED_FILE_DIR)/chur-filament/libktxreader.a $(DERIVED_FILE_DIR)/chur-filament/libbasis_transcoder.a $(DERIVED_FILE_DIR)/chur-filament/libdracodec.a $(DERIVED_FILE_DIR)/chur-filament/libmeshoptimizer.a $(DERIVED_FILE_DIR)/chur-filament/libzstd.a $(DERIVED_FILE_DIR)/chur-filament/libabseil.a $(DERIVED_FILE_DIR)/chur-filament/libimage.a $(DERIVED_FILE_DIR)/chur-filament/libibl.a $(DERIVED_FILE_DIR)/chur-filament/libmikktspace.a $(DERIVED_FILE_DIR)/chur-filament/libshaders.a $(DERIVED_FILE_DIR)/chur-filament/libsmol-v.a"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGNING_ALLOWED: NO
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG CHUR_FILAMENT"
    dependencies:
      - target: ChurShare
        embed: true
    preBuildScripts:
      - name: Build shared framework
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          "$SRCROOT/SpiritRenderer/stage-filament.sh"
          cd "$SRCROOT/../.."
          case "$PLATFORM_NAME" in
            iphonesimulator) target=IosSimulatorArm64; directory=iosSimulatorArm64; triple=aarch64-apple-ios-sim ;;
            iphoneos) target=IosArm64; directory=iosArm64; triple=aarch64-apple-ios ;;
            *) echo "Unsupported Apple platform: $PLATFORM_NAME" >&2; exit 1 ;;
          esac
          case "$CONFIGURATION" in
            Debug|Release) ;;
            *) echo "Unsupported configuration: $CONFIGURATION" >&2; exit 1 ;;
          esac
          ./gradlew ":shared:app:link${CONFIGURATION}Framework${target}"
          variant="$(printf '%s' "$CONFIGURATION" | tr '[:upper:]' '[:lower:]')Framework"
          mkdir -p "$DERIVED_FILE_DIR"
          ditto "shared/app/build/bin/$directory/$variant/ChurApp.framework" "$DERIVED_FILE_DIR/ChurApp.framework"
          ditto "rust/target/$triple/${variant%Framework}/libchur_ffi.a" "$DERIVED_FILE_DIR/libchur_ffi.a"

  ChurShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - ShareExtension
      - path: Sources/IncomingShareInbox.swift
      - path: Sources/IncomingShareItems.swift
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Chur
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsAttachmentsWithMaxCount: 64
              NSExtensionActivationSupportsFileWithMaxCount: 64
              NSExtensionActivationSupportsImageWithMaxCount: 64
              NSExtensionActivationSupportsMovieWithMaxCount: 64
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 64
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.po4yka.chur.share
        CODE_SIGN_ENTITLEMENTS: IncomingShare.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        ARCHS: arm64
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: NO
