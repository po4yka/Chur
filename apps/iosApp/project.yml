name: Chur
options:
  createIntermediateGroups: true
targets:
  Chur:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - Sources
      - Assets.xcassets
    info:
      path: Info.plist
      properties:
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        CADisableMinimumFrameDurationOnPhone: true
        LSRequiresIPhoneOS: true
        NSCameraUsageDescription: "Take public photos when you tap Take photo. Photos are saved only when you choose Save photo."
        NSPhotoLibraryAddUsageDescription: "Save selected vault media to your photo library."
        NSPhotoLibraryUsageDescription: "Import complete Live Photo resources and review deletion of imported originals only when you choose."
        NSLocalNetworkUsageDescription: "Sync this vault with a server on your local network, when you connect to one."
        NSFaceIDUsageDescription: "Use Face ID to open your Chur vault and to confirm it's you before showing a recovery phrase."
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: dev.po4yka.chur.live-photo
            UTTypeDescription: Chur Live Photo bundle
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - churlive
              public.mime-type:
                - application/vnd.chur.live-photo
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: "$(PRODUCT_MODULE_NAME).SceneDelegate"
        BGTaskSchedulerPermittedIdentifiers:
          - dev.po4yka.chur.sync.refresh
        UIBackgroundModes:
          - fetch
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.po4yka.chur
        CODE_SIGN_ENTITLEMENTS: IncomingShare.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ARCHS: arm64
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(DERIVED_FILE_DIR)"
        OTHER_LDFLAGS: "$(inherited) $(DERIVED_FILE_DIR)/ChurApp.framework/ChurApp $(DERIVED_FILE_DIR)/libchur_ffi.a"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGNING_ALLOWED: NO
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    dependencies:
      - target: ChurShare
        embed: true
    preBuildScripts:
      - name: Build shared framework
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          cd "$SRCROOT/../.."
          case "$PLATFORM_NAME" in
            iphonesimulator) target=IosSimulatorArm64; directory=iosSimulatorArm64; triple=aarch64-apple-ios-sim ;;
            iphoneos) target=IosArm64; directory=iosArm64; triple=aarch64-apple-ios ;;
            *) echo "Unsupported Apple platform: $PLATFORM_NAME" >&2; exit 1 ;;
          esac
          case "$CONFIGURATION" in
            Debug|Release) ;;
            *) echo "Unsupported configuration: $CONFIGURATION" >&2; exit 1 ;;
          esac
          ./gradlew ":shared:app:link${CONFIGURATION}Framework${target}"
          variant="$(printf '%s' "$CONFIGURATION" | tr '[:upper:]' '[:lower:]')Framework"
          mkdir -p "$DERIVED_FILE_DIR"
          ditto "shared/app/build/bin/$directory/$variant/ChurApp.framework" "$DERIVED_FILE_DIR/ChurApp.framework"
          ditto "rust/target/$triple/${variant%Framework}/libchur_ffi.a" "$DERIVED_FILE_DIR/libchur_ffi.a"

  ChurShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - ShareExtension
      - path: Sources/IncomingShareInbox.swift
      - path: Sources/IncomingShareItems.swift
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Chur
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsAttachmentsWithMaxCount: 64
              NSExtensionActivationSupportsFileWithMaxCount: 64
              NSExtensionActivationSupportsImageWithMaxCount: 64
              NSExtensionActivationSupportsMovieWithMaxCount: 64
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 64
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.po4yka.chur.share
        CODE_SIGN_ENTITLEMENTS: IncomingShare.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        ARCHS: arm64
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: NO
