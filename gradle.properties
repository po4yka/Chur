# Gradle build behaviour. Values are deliberate, not defaults.

org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Kotlin
kotlin.code.style=official

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# Every deprecation is visible, because a silent one becomes a forced upgrade
# later and DEPENDENCY_POLICY.md wants upgrades deliberate.
org.gradle.warning.mode=all

# Kotlin Multiplatform
#
# The cinterop bindings of `:shared:core-ffi` are per target, and the shared
# `iosMain` source set compiles once for both. Without commonization that
# compilation cannot see them and every reference to the generated package is
# unresolved, which is what the failure looks like: the code is correct and the
# classpath is not.
kotlin.mpp.enableCInteropCommonization=true

# `expect`/`actual` classes are Beta and warn on every use. Chur uses them
# deliberately for ChurBuffer and ChurNative, where the two platforms differ in
# representation rather than in behaviour, so the warning is acknowledged here
# rather than repeated on every build.
kotlin.suppressExpectActualClassesWarning=true
