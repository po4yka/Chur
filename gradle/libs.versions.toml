# The pinned toolchain and dependency set for the Gradle build.
#
# `DEVELOPMENT.md` requires exact versions rather than globally mutable
# defaults, and `DEPENDENCY_POLICY.md` requires lockfiles and deliberate
# upgrades. Every version here is exact; none is a range.

[versions]
# Toolchain
jdk = "21"
kotlin = "2.4.10"
agp = "9.3.2"
composeMultiplatform = "1.11.1"
# Compose Multiplatform Material 3 ships on its own version line, not the
# release-train number above.
composeMaterial3 = "1.9.0"

# Android, frozen by ADR-0017: minSdk 29, targetSdk 37.
androidMinSdk = "29"
androidCompileSdk = "37"
androidTargetSdk = "37"

# iOS, frozen by ADR-0017. The Rust link and the vendored C of ADR-0038 must
# agree on it, or the link fails on a symbol the older target does not provide.
iosDeploymentTarget = "18.0"

# Libraries
kotlinxSerialization = "1.11.0"
kotlinxCoroutines = "1.11.0"
androidxCoreKtx = "1.19.0"
androidxActivityCompose = "1.13.0"
androidxLifecycle = "2.11.0"
androidxBiometric = "1.1.0"
# Media3 plays the decrypted ranges a vault-backed data source hands it.
# MEDIA_PIPELINE.md section 1 puts codec work on the platform, and this is the
# platform's player on Android.
androidxMedia3 = "1.9.0"

[libraries]
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCoreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivityCompose" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
androidx-biometric = { module = "androidx.biometric:biometric", version.ref = "androidxBiometric" }
androidx-media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "androidxMedia3" }
androidx-media3-datasource = { module = "androidx.media3:media3-datasource", version.ref = "androidxMedia3" }
androidx-media3-ui = { module = "androidx.media3:media3-ui", version.ref = "androidxMedia3" }

# Compose Multiplatform artifacts, named directly. The `compose.runtime` style
# of accessor is deprecated in 1.11.
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "composeMaterial3" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
# AGP 9 requires this plugin for a Kotlin Multiplatform module; the classic
# `com.android.library` plugin refuses to apply beside the multiplatform one.
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
