# Enforcing workflow for the release gates.
#
# ADR-0031 fixes the v1 minimum job set and RELEASE_GATES.md "Enforcement" is
# the single place the enforcement rules live. Jobs join this file as their
# subject lands; a document may not name a job that does not exist here.
#
# The file is named rust.yml because ADR-0031 named it when Rust was the only
# build. It now also runs the Gradle build; the name is kept so the ADR and
# every document that cites it stay true.
#
# Every action is pinned to an immutable commit SHA per DEPENDENCY_POLICY.md
# "Version policy". Neither toolchain is installed by an action: the runner's
# rustup reads rust/rust-toolchain.toml and the Gradle wrapper reads
# gradle/wrapper/gradle-wrapper.properties, whose distribution SHA-256 is
# recorded there, so the pinned versions are the ones that run these checks.

name: build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    working-directory: rust

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: rustup component add rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: clippy-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}
      - run: rustup component add clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: test-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}
      - run: cargo test --workspace

  vectors:
    name: vector set
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: vectors-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}
      # TEST_VECTORS.md section 8: a generator update must reproduce historical
      # vectors byte for byte. `verify` rebuilds the whole set and compares it,
      # so a change that alters one fails here rather than shipping.
      - run: cargo run -p chur-cli -- vectors verify --dir ../test-vectors/v1
      # The same section has release CI archive the vector-set digest. The
      # formula lives in chur-cli rather than in a shell pipeline, so the value
      # does not depend on how a platform orders `find` or formats a checksum
      # line.
      - name: record the vector-set digest
        run: cargo run -p chur-cli -- vectors digest --dir ../test-vectors/v1
          | tee ../vector-set-digest.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vector-set-digest
          path: vector-set-digest.txt

  abi:
    name: C ABI harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: abi-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}
      # FFI_CONTRACT.md section 2 makes the handshake what a platform gate
      # checks before a vault opens. Linking a C program against the real
      # static library proves the symbols exist with C linkage and the declared
      # types, which a Rust test cannot.
      - run: cargo build -p chur-ffi --release
      - name: build and run the handshake harness
        run: |
          set -euo pipefail
          # The static library now carries vendored SQLCipher and OpenSSL
          # (ADR-0038), so the link needs the C runtime libraries they use.
          cc -Wall -Wextra -Werror \
            -I crates/chur-ffi/include \
            crates/chur-ffi/tests/handshake.c \
            target/release/libchur_ffi.a \
            -lpthread -ldl -lm \
            -o handshake
          ./handshake
          rm -rf chur-abi-harness-root

  fuzz:
    name: fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            rust/fuzz/target
          key: fuzz-${{ hashFiles('rust/fuzz/Cargo.toml', 'rust/Cargo.lock') }}
      # libFuzzer needs a nightly toolchain and sanitizer flags that must not
      # reach the library build, which is why rust/fuzz is its own workspace.
      # The pinned stable toolchain still runs every other job.
      - run: rustup toolchain install nightly --profile minimal --component rust-src
      - run: cargo install --locked cargo-fuzz
      # FUZZING.md section 10: a short deterministic smoke fuzz on every pull
      # request that touches target code. A longer scheduled campaign is not
      # this job and is still unenforced.
      - name: smoke fuzz every target
        run: |
          set -euo pipefail
          for target in $(cargo +nightly fuzz list); do
            echo "== $target"
            cargo +nightly fuzz run "$target" -- -runs=20000 -max_total_time=30
          done

  vendored-skills:
    name: vendored skills
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # DEPENDENCY_POLICY.md "Vendored agent skills": every entry records a
      # content hash and the upstream commit it came from. The offline half of
      # the check recomputes the hash of every vendored directory, so content
      # that drifts from the lockfile fails here.
      - run: python3 scripts/check-vendored-skills.py

  native-targets:
    name: native targets (${{ matrix.kind }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: android
            os: ubuntu-latest
            targets: aarch64-linux-android x86_64-linux-android
          - kind: apple
            os: macos-latest
            targets: aarch64-apple-ios aarch64-apple-ios-sim
    # The script finds the repository root itself.
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: native-${{ matrix.kind }}-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}
      - run: rustup target add ${{ matrix.targets }}
      # DEVELOPMENT.md "Native targets" requires these four, and an artifact
      # that exports no `chur_` symbol is one a host would load and fail to
      # call, so the script checks the handshake in every archive it produces.
      - run: scripts/build-native-targets.sh ${{ matrix.kind }}

  gradle:
    name: gradle check
    runs-on: ubuntu-latest
    # The Gradle build lives at the repository root, not in rust/.
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
      # The host tests load `libchur_jni`, which the root build compiles with
      # Cargo (ADR-0040). The runner's rustup reads rust/rust-toolchain.toml, so
      # no toolchain is installed by an action here either.
      - run: rustup show
      # The JVM and Android host tests. The iOS target needs macOS and runs in
      # the kotlin-native job.
      #
      # The isolation task is named as well as the test tasks: it is the
      # build-graph half of SEC-019 in SECURITY_TEST_PLAN.md section 13, and a
      # row of that section may not name a job that does not run it.
      - run: ./gradlew --no-daemon jvmTest testAndroidHostTest
          :shared:feature-notes:churPublicShellIsolation

  kotlin-native:
    name: kotlin/native tests
    runs-on: macos-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: konan-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
      # cinterop links `libchur_ffi.a` for each Apple target, which the Gradle
      # build compiles with Cargo, so both targets must be installed first.
      - run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim
      # TEST_VECTORS.md section 7 requires the vector suite to run on iOS as
      # well. This is that run, as a real Kotlin/Native binary.
      - run: ./gradlew --no-daemon iosSimulatorArm64Test
      - run: ./gradlew --no-daemon compileKotlinIosArm64
      # The Compose Multiplatform shell links as an iOS framework, statically
      # against `libchur_ffi.a`. The Xcode project that embeds it is the host
      # application's; linking here proves the framework and the static library
      # agree on every symbol cinterop generated a binding for.
      - run: ./gradlew --no-daemon linkDebugFrameworkIosSimulatorArm64

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo
          key: deny-${{ hashFiles('rust/Cargo.lock') }}
      - run: cargo install --locked cargo-deny
      - run: cargo deny check
