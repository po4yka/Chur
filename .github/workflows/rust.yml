# Enforcing workflow for the release gates.
#
# ADR-0031 fixes the v1 minimum job set and RELEASE_GATES.md "Enforcement" is
# the single place the enforcement rules live. Jobs join this file as their
# subject lands; a document may not name a job that does not exist here.
#
# The file is named rust.yml because ADR-0031 named it when Rust was the only
# build. It now also runs the Gradle build; the name is kept so the ADR and
# every document that cites it stay true.
#
# Every action is pinned to an immutable commit SHA per DEPENDENCY_POLICY.md
# "Version policy". Neither toolchain is installed by an action: the runner's
# rustup reads rust/rust-toolchain.toml and the Gradle wrapper reads
# gradle/wrapper/gradle-wrapper.properties, whose distribution SHA-256 is
# recorded there, so the pinned versions are the ones that run these checks.

name: build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    working-directory: rust

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # A pull request that changes only top-level Markdown files or files under
  # docs/ cannot change what the gated jobs below build or test: no build,
  # test, or script reads those paths. Those jobs then skip, and GitHub reports
  # a skipped job as successful. The four jobs ADR-0031 requires on every pull
  # request and the two policy-script jobs always run, and a push to main runs
  # every job. RELEASE_GATES.md "Enforcement" records this rule.
  changes:
    name: changed paths
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    outputs:
      code: ${{ steps.paths.outputs.code }}
    steps:
      # The pull request ref is a merge commit; its first parent is the base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: paths
        run: |
          set -euo pipefail
          code=true
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]] &&
            ! git diff --name-only HEAD^1 HEAD | grep -qvE '^(docs/|[^/]+\.md$)'; then
            code=false
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup component add rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: clippy-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}
      - run: rustup component add clippy
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: test-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}
      - run: cargo test --locked --workspace

  vectors:
    name: vector set
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: vectors-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}
      # TEST_VECTORS.md section 8: a generator update must reproduce historical
      # vectors byte for byte. `verify` rebuilds the whole set and compares it,
      # so a change that alters one fails here rather than shipping.
      - run: cargo run --locked -p chur-cli -- vectors verify --dir ../test-vectors/v1
      # The same section has release CI archive the vector-set digest. The
      # formula lives in chur-cli rather than in a shell pipeline, so the value
      # does not depend on how a platform orders `find` or formats a checksum
      # line.
      - name: record the vector-set digest
        run: cargo run --locked -p chur-cli -- vectors digest --dir ../test-vectors/v1
          | tee ../vector-set-digest.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vector-set-digest
          path: vector-set-digest.txt

  abi:
    name: C ABI harness
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: abi-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}
      # FFI_CONTRACT.md section 2 makes the handshake what a platform gate
      # checks before a vault opens. Linking a C program against the real
      # static library proves the symbols exist with C linkage and the declared
      # types, which a Rust test cannot.
      - run: cargo build --locked -p chur-ffi --release
      - name: build and run the handshake harness
        run: |
          set -euo pipefail
          # The static library now carries vendored SQLCipher and OpenSSL
          # (ADR-0038), so the link needs the C runtime libraries they use.
          cc -Wall -Wextra -Werror \
            -I crates/chur-ffi/include \
            crates/chur-ffi/tests/handshake.c \
            target/release/libchur_ffi.a \
            -lpthread -ldl -lm \
            -o handshake
          ./handshake
          rm -rf chur-abi-harness-root

  fuzz:
    name: fuzz smoke
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            rust/fuzz/target
          key: fuzz-${{ hashFiles('rust/fuzz/Cargo.toml', 'rust/Cargo.lock') }}
      # libFuzzer needs a nightly toolchain and sanitizer flags that must not
      # reach the library build, which is why rust/fuzz is its own workspace.
      # The pinned stable toolchain still runs every other job.
      - run: rustup toolchain install nightly --profile minimal --component rust-src
      # `~/.cargo/bin` is inside the cache, so a restored cache already carries
      # the binary and a plain `cargo install` stops with "already exists".
      - run: command -v cargo-fuzz || cargo install --locked cargo-fuzz
      # FUZZING.md section 10: a short deterministic smoke fuzz on every pull
      # request that touches target code. A longer scheduled campaign is not
      # this job and is still unenforced.
      - name: smoke fuzz every target
        run: |
          set -euo pipefail
          for target in $(cargo +nightly fuzz list); do
            echo "== $target"
            cargo +nightly fuzz run "$target" -- -runs=20000 -max_total_time=30
          done

  vendored-skills:
    name: vendored skills
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # DEPENDENCY_POLICY.md "Vendored agent skills": every entry records a
      # content hash and the upstream commit it came from. The offline half of
      # the check recomputes the hash of every vendored directory, so content
      # that drifts from the lockfile fails here.
      - run: python3 scripts/check-vendored-skills.py

  backup-rules:
    name: android backup rules
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # ANDROID.md section 13.4: release MUST fail when either rule file names a
      # path under vaults/ or registry/, or declares an include of the root or
      # external domain. An <include> set makes everything else excluded, so
      # widening one is how vault storage would enter an archive, and it would
      # enter silently. The script also checks that the public shell's own two
      # paths are still included, which DISCREET_MODE.md requires, checks each
      # data-extraction section on its own, and checks the manifest wiring.
      - run: python3 scripts/check-backup-rules.py
      - run: python3 -m unittest discover -s scripts -p test_check_backup_rules.py -v

  native-targets:
    name: native targets (${{ matrix.kind }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: android
            os: ubuntu-latest
            targets: aarch64-linux-android x86_64-linux-android
          - kind: apple
            os: macos-latest
            targets: aarch64-apple-ios aarch64-apple-ios-sim
    # The script finds the repository root itself.
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: native-${{ matrix.kind }}-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}
      # rustup adds a target to the active toolchain. This step must run where
      # rust-toolchain.toml applies, or the targets land on the runner's default
      # toolchain and the pinned one builds without them.
      - name: add the targets to the pinned toolchain
        working-directory: rust
        run: rustup target add ${{ matrix.targets }}
      # DEVELOPMENT.md "Native targets" requires these four, and an artifact
      # that exports no `chur_` symbol is one a host would load and fail to
      # call, so the script checks the handshake in every archive it produces.
      - run: scripts/build-native-targets.sh ${{ matrix.kind }}

  gradle:
    name: gradle check
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # The Gradle build lives at the repository root, not in rust/.
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
      # The host tests load `libchur_jni`, which the root build compiles with
      # Cargo (ADR-0040). The runner's rustup reads rust/rust-toolchain.toml, so
      # no toolchain is installed by an action here either.
      - name: install the pinned toolchain
        working-directory: rust
        run: rustup show
      # The JVM and Android host tests. The iOS target needs macOS and runs in
      # the kotlin-native job.
      #
      # The isolation task is named as well as the test tasks: it is the
      # build-graph half of SEC-019 in SECURITY_TEST_PLAN.md section 13, and a
      # row of that section may not name a job that does not run it.
      - name: desktop control client tests
        run: python3 -m unittest discover -s scripts -p test_chur_device.py -v
      - run: ./gradlew --no-daemon jvmTest testAndroidHostTest
          :shared:feature-notes:churPublicShellIsolation

  android-application:
    name: android application
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      # This job receives the release signing password on main. Do not save a
      # build cache that a pull request could restore after Cargo or Gradle ran
      # with that environment.
      - name: install the pinned toolchain
        working-directory: rust
        run: rustup show
      - name: add the Android targets to the pinned toolchain
        working-directory: rust
        run: rustup target add aarch64-linux-android x86_64-linux-android
      - name: install the pinned Android NDK
        run: |
          ndk_version=$(sed -n 's/^ndk = "\([^"]*\)"/\1/p' gradle/libs.versions.toml)
          test -n "$ndk_version"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk_version"
      # `gradle check` compiles the library modules and stops there, so nothing
      # built the application itself: `MainActivity`, the route table, the
      # importer, the export sink and the device-slot binding are the whole
      # Android host and no job compiled a line of them. Assembling is also the
      # only thing that runs the native packaging path of ADR-0040 — the Cargo
      # cross-build, the per-ABI staging, and the `jniLibs` layout — which a
      # library-module build never reaches. Lint runs beside it, because an
      # Android host defect is more often a manifest or a resource than a type
      # error. The instrumented tests are assembled here and the notes/lock
      # and HEVC Main10 checks run that application on an owned emulator.
      #
      # The same run re-resolves with --write-locks: DEFAULT locking honors
      # the committed lockfiles but does not fail on a drift, so the pin is
      # enforced by the diff below. The assemble and lint tasks are what
      # resolve the configurations a bare `dependencies` report never reaches.
      - run: ./gradlew --no-daemon :apps:androidApp:assembleDebug :apps:androidApp:lintDebug :apps:androidApp:assembleDebugAndroidTest --write-locks
      - name: the Gradle lockfiles pin the resolution
        run: git diff --exit-code -- '**/gradle.lockfile'
      # ANDROID.md 13.4: the merged manifest is what the platform reads, so a
      # library or variant manifest must not replace either backup-rules file.
      - name: check the backup wiring of the merged manifest
        run: python3 scripts/check-backup-rules.py --merged-manifest
      - name: install the Android notes UI test image
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "emulator" "system-images;android-35;google_apis;x86_64"
      - name: exercise notes, private lock, Main10, and extended video on Android
        timeout-minutes: 20
        run: scripts/test-android-notes-ui.sh
      - name: upload notes and video results, screenshots, and device logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes-ui-${{ github.sha }}
          path: build/notes-ui-ci/
          if-no-files-found: error

      - name: prepare Android release signing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CHUR_RELEASE_KEYSTORE_BASE64: ${{ secrets.CHUR_RELEASE_KEYSTORE_BASE64 }}
          CHUR_RELEASE_PASSWORD: ${{ secrets.CHUR_RELEASE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$CHUR_RELEASE_KEYSTORE_BASE64"
          test -n "$CHUR_RELEASE_PASSWORD"
          umask 077
          printf '%s' "$CHUR_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/chur-release.p12"
          {
            echo "CHUR_RELEASE_KEYSTORE=$RUNNER_TEMP/chur-release.p12"
            echo "CHUR_RELEASE_PASSWORD=$CHUR_RELEASE_PASSWORD"
            echo "CHUR_RELEASE_CERT_SHA256=747ec3a4cad129e9bde4437c389c138c84933cbfb1a2a34253b6c4d1c6513c8d"
          } >> "$GITHUB_ENV"
      - name: prepare disposable signing for pull requests
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          umask 077
          keytool -genkeypair -alias chur-release -keyalg RSA -keysize 3072 -validity 2 \
            -dname 'CN=Pull Request Smoke' -storetype PKCS12 -storepass local-smoke-only \
            -keystore "$RUNNER_TEMP/chur-release-smoke.p12"
          keytool -exportcert -alias chur-release -keystore "$RUNNER_TEMP/chur-release-smoke.p12" \
            -storepass local-smoke-only -rfc > "$RUNNER_TEMP/chur-release-smoke.pem"
          digest=$(openssl x509 -in "$RUNNER_TEMP/chur-release-smoke.pem" -noout -fingerprint -sha256 \
            | cut -d= -f2 | tr -d : | tr '[:upper:]' '[:lower:]')
          {
            echo "CHUR_RELEASE_KEYSTORE=$RUNNER_TEMP/chur-release-smoke.p12"
            echo "CHUR_RELEASE_PASSWORD=local-smoke-only"
            echo "CHUR_RELEASE_CERT_SHA256=$digest"
          } >> "$GITHUB_ENV"
      - name: assemble and inspect Android release
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :apps:androidApp:assembleRelease :apps:androidApp:bundleRelease :apps:androidApp:lintRelease
          {
            echo "source_commit=$(git rev-parse HEAD)"
            echo "cargo_lock_sha256=$(sha256sum rust/Cargo.lock | cut -d' ' -f1)"
            python3 scripts/check-android-release.py \
              apps/androidApp/build/outputs/apk/release/androidApp-release.apk \
              apps/androidApp/build/outputs/bundle/release/androidApp-release.aab \
              apps/androidApp/build/outputs/native-debug-symbols/release/native-debug-symbols.zip \
              "$CHUR_RELEASE_CERT_SHA256"
          } | tee android-release-checks.txt
      - name: upload signed Android release candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-release-candidate-${{ github.sha }}
          path: |
            apps/androidApp/build/outputs/apk/release/androidApp-release.apk
            apps/androidApp/build/outputs/bundle/release/androidApp-release.aab
            apps/androidApp/build/outputs/native-debug-symbols/release/native-debug-symbols.zip
            apps/androidApp/build/outputs/mapping/release/mapping.txt
            android-release-checks.txt
          if-no-files-found: error

  kotlin-native:
    name: kotlin/native tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # The iOS host needs the Xcode 27.1 SDK (README.md: Xcode 27 for host
    # builds); the macOS 26 image tops out at Xcode 26.6.
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: konan-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
      # cinterop links `libchur_ffi.a` for each Apple target, which the Gradle
      # build compiles with Cargo, so both targets must be installed first.
      - name: add the targets to the pinned toolchain
        working-directory: rust
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim
      # Vision OCR needs a fully booted simulator; standalone spawn has no
      # complete Vision service environment. This job owns this device only.
      - name: boot an owned simulator for Vision tests
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          runtimes = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "runtimes", "--json"]))["runtimes"]
          available = [runtime for runtime in runtimes if runtime["isAvailable"] and runtime["name"].startswith("iOS ")]
          runtime = max(available, key=lambda item: tuple(map(int, item["version"].split("."))))
          device_type = next(item["identifier"] for item in runtime["supportedDeviceTypes"] if item["productFamily"] == "iPhone")
          name = "Chur CI " + os.environ["GITHUB_RUN_ID"] + " " + os.environ["GITHUB_RUN_ATTEMPT"]
          device = subprocess.check_output(["xcrun", "simctl", "create", name, device_type, runtime["identifier"]], text=True).strip()
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as environment:
              environment.write("CHUR_IOS_TEST_DEVICE=" + device + "\n")
          subprocess.run(["xcrun", "simctl", "boot", device], check=True)
          subprocess.run(["xcrun", "simctl", "bootstatus", device, "-b"], check=True)
          PY
      # TEST_VECTORS.md section 7 requires the vector suite to run on iOS as
      # well. This is that run, as a real Kotlin/Native binary.
      # All modules share this one device. Keep native tests and compilation
      # from competing with real AVPlayer/Vision requests on the simulator.
      #
      # The Compose Multiplatform shell links as an iOS framework, statically
      # against `libchur_ffi.a`. The Xcode project that embeds it is the host
      # application's; linking here proves the framework and the static library
      # agree on every symbol cinterop generated a binding for.
      #
      # --write-locks enforces the same lockfile pin as the Android job, for
      # the Kotlin/Native configurations that only a macOS job resolves.
      - run: ./gradlew --no-daemon --no-parallel --max-workers=1 iosSimulatorArm64Test compileKotlinIosArm64 linkDebugFrameworkIosSimulatorArm64 --write-locks
      - name: the Gradle lockfiles pin the resolution
        run: git diff --exit-code -- '**/gradle.lockfile'
      # The checksum-pinned Filament iOS SDK is large; restore it instead of
      # downloading it on every run. The key follows the version and SHA-256
      # that prepare-filament.sh pins, and the script rechecks the marker.
      - id: filament-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/iosApp/SpiritRenderer/.vendor/filament
          key: filament-ios-${{ hashFiles('apps/iosApp/SpiritRenderer/prepare-filament.sh') }}
      # A failed restore only warns and can leave a partial SDK, which the
      # prepare script refuses to overwrite. Start clean unless it was a hit.
      - name: discard a partial Filament restore
        if: steps.filament-cache.outputs.cache-hit != 'true'
        run: rm -rf apps/iosApp/SpiritRenderer/.vendor/filament
      # Compile the actual UIKit/Metal host, not only its Kotlin framework.
      # The prebuild script stages checksum-pinned Filament archives for this SDK.
      - name: compile the iOS app and interactive spirit host
        run: >-
          xcodebuild -project apps/iosApp/Chur.xcodeproj -scheme Chur
          -configuration Debug -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
      - name: upload iOS test diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-test-results-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            shared/**/build/test-results/iosSimulatorArm64Test/*.xml
            shared/app/build/reports/video-acceptance/ios/*.json
          if-no-files-found: warn
      - name: remove the owned Vision test simulator
        if: always()
        run: |
          if [[ -n "${CHUR_IOS_TEST_DEVICE:-}" ]]; then
            xcrun simctl shutdown "$CHUR_IOS_TEST_DEVICE" || true
            xcrun simctl delete "$CHUR_IOS_TEST_DEVICE"
          fi

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    env:
      CARGO_DENY_VERSION: 0.20.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo
          key: deny-${{ env.CARGO_DENY_VERSION }}-${{ hashFiles('rust/Cargo.lock', 'rust/fuzz/Cargo.lock') }}
      # The cache holds all of `~/.cargo`, the installed binary with it. A
      # presence check would keep a restored binary of an older release, and
      # cargo-deny 0.19 rejects the argument order of the fuzz step below. The
      # step installs the pinned release unless that exact release is present.
      # The pin is in the cache key, so a new pin saves a new cache.
      - name: install the pinned cargo-deny
        run: |
          cargo deny --version | grep -qxF "cargo-deny $CARGO_DENY_VERSION" \
            || cargo install --locked --force cargo-deny --version "$CARGO_DENY_VERSION"
      - run: cargo deny check
      # The fuzz workspace is its own dependency graph: libfuzzer and its
      # bridge join it only there, so the same policy checks it explicitly.
      # cargo-deny 0.20 takes `--config` before the subcommand and rejects it
      # after `check`.
      - name: cargo deny (fuzz workspace)
        working-directory: rust/fuzz
        run: cargo deny --config ../deny.toml check
