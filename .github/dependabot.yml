version: 2
# Minor and patch updates of one ecosystem share a pull request: separate pull
# requests conflict on the same lockfile, and each rebase reruns the full build.
# Major and security updates keep their own pull requests.
updates:
  - package-ecosystem: cargo
    directory: /rust
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo:
        update-types: [minor, patch]

  # The libFuzzer graph has its own manifest and lockfile.
  - package-ecosystem: cargo
    directory: /rust/fuzz
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-fuzz:
        update-types: [minor, patch]

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      gradle:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        update-types: [minor, patch]

  - package-ecosystem: rust-toolchain
    directory: /rust
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
